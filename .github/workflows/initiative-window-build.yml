name: Build and release Obsidian test plugin

on:
  push:
    branches:
      - feature/initiative-window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare Obsidian test files
        run: |
          mkdir -p release
          cp dist/main.js release/main.js
          cp dist/styles.css release/style.css
          cp dist/styles.css release/styles.css
          cp manifest.json release/manifest.json
          cd release
          zip -r ../atlas-vtt-initiative-window.zip main.js style.css styles.css manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: initiative-window-build-${{ github.run_number }}
          name: Initiative Window build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            atlas-vtt-initiative-window.zip
            release/main.js
            release/style.css
            release/styles.css
            release/manifest.json
