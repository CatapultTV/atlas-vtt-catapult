name: Build and release Obsidian test plugin

on:
  push:
    branches:
      - feature/initiative-window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare Obsidian plugin files
        run: |
          mkdir -p release
          cp dist/main.js release/main.js
          cp dist/styles.css release/styles.css
          cp manifest.json release/manifest.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: initiative-window-build-${{ github.run_number }}
          name: Initiative Display test build ${{ github.run_number }}
          body: |
            Test build of Atlas VTT with the Initiative Display.

            Install by replacing the existing Atlas VTT plugin files with the three assets below:
            - main.js
            - styles.css
            - manifest.json

            No ZIP or alternate stylesheet is required.
          prerelease: true
          generate_release_notes: false
          files: |
            release/main.js
            release/styles.css
            release/manifest.json
